name: Seed Staging (manual)

# HANYA dipicu manual (workflow_dispatch) - TIDAK pernah jalan otomatis saat
# push. Seed menimpa password admin/root jadi `pass1234`.
#
# CLI: gh workflow run seed-staging.yml --ref staging -f confirm=true
#
# Secrets:
#   TURSO_STAGING_DATABASE_URL
#   TURSO_STAGING_AUTH_TOKEN

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Centang untuk benar-benar seed DB staging (menimpa password admin/root)'
        type: boolean
        required: true
        default: false

jobs:
  seed:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Seed database staging
        run: pnpm seed
        env:
          NODE_ENV: staging
          DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}
          JWT_PRIVATE_KEY: dummy
          JWT_PUBLIC_KEY: dummy
          CORS_ALLOWED_ORIGINS: https://console-sambasku-staging.iamutaki.com
