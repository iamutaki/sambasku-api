name: Seed Staging (manual)

# HANYA dipicu manual (workflow_dispatch) — TIDAK pernah jalan otomatis saat
# push. Seed menimpa password admin/root jadi `pass1234`, jadi harus dipicu
# sadar, bukan bagian dari alur deploy.
#
# Cara pakai:
#   UI   : Actions → "Seed Staging (manual)" → Run workflow → pilih branch
#          `staging` + centang confirm.
#   CLI  : gh workflow run seed-staging.yml --ref staging -f confirm=true
#
# PENTING: workflow_dispatch hanya muncul/tombolnya aktif kalau file ini ADA di
# default branch (`main`). Jadi commit/cherry-pick juga ke `main`.
#
# Secrets (sama seperti deploy-staging.yml):
#   STAGING_DATABASE_URL_DIRECT — Neon DIRECT URL staging (?sslmode=require)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Centang untuk benar-benar seed DB staging (menimpa password admin/root)'
        type: boolean
        required: true
        default: false

jobs:
  seed:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Seed hanya butuh DATABASE_URL. env.ts mewajibkan JWT key + CORS, tapi
      # seed tidak memakainya — nilai dummy cukup (lihat src/shared/config/env.ts).
      - name: Seed database staging
        run: pnpm seed
        env:
          NODE_ENV: staging
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_DIRECT }}
          JWT_PRIVATE_KEY: dummy
          JWT_PUBLIC_KEY: dummy
          CORS_ALLOWED_ORIGINS: https://console-sambasku-staging.iamutaki.com
