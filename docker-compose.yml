services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_sambasku
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ponytail: DB test terpisah (Section 10) — nyalakan saat mau jalan
  # integration/e2e test: `docker compose up -d postgres-test`
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_sambasku_test
    ports:
      - '5433:5432'

volumes:
  pgdata:
